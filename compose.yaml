services:
  home-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-page
    restart: unless-stopped
    ports:
      - "127.0.0.1:38741:38741"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:38741/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
